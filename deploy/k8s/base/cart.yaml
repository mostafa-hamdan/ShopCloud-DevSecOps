apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart
  namespace: shopcloud
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cart
  template:
    metadata:
      labels:
        app: cart
    spec:
      containers:
        - name: cart
          image: REPLACE_ME/shopcloud/cart:dev
          ports:
            - containerPort: 8002
          env:
            - name: CORS_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: shopcloud-config
                  key: CORS_ORIGINS
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: shopcloud-secrets
                  key: REDIS_URL
            - name: CUSTOMER_DEMO_TOKEN
              valueFrom:
                secretKeyRef:
                  name: shopcloud-secrets
                  key: CUSTOMER_DEMO_TOKEN
            - name: ADMIN_DEMO_TOKEN
              valueFrom:
                secretKeyRef:
                  name: shopcloud-secrets
                  key: ADMIN_DEMO_TOKEN
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8002
            initialDelaySeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8002
            initialDelaySeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 400m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: cart
  namespace: shopcloud
spec:
  selector:
    app: cart
  ports:
    - port: 8002
      targetPort: 8002