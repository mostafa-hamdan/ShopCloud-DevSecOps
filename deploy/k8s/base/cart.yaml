# Cart: Redis-backed shopping cart and wishlist. Stateless app pods;
# Redis (ElastiCache) holds session state.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart
  namespace: shopcloud
  labels:
    app: cart
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cart
  template:
    metadata:
      labels:
        app: cart
    spec:
      containers:
        - name: cart
          image: REPLACE_ME/shopcloud/cart:dev
          ports:
            - containerPort: 8002
          envFrom:
            - configMapRef:
                name: shopcloud-config
          env:
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: shopcloud-secrets
                  key: REDIS_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: shopcloud-secrets
                  key: JWT_SECRET
            - name: INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: shopcloud-secrets
                  key: INTERNAL_API_KEY
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 400m
              memory: 256Mi
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: cart
---
apiVersion: v1
kind: Service
metadata:
  name: cart
  namespace: shopcloud
spec:
  selector:
    app: cart
  ports:
    - port: 8002
      targetPort: 8002
