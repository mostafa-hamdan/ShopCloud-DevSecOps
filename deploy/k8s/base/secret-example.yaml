# Example only — DO NOT commit real secrets.
#
# In production these values come from AWS Secrets Manager via the
# External Secrets Operator (or a similar SSCSI provider) — see
# infra/terraform/modules/irsa/ for the IAM wiring. Locally for kind /
# minikube testing, copy this file to `secret.yaml` (gitignored), fill
# in real values, and apply.
apiVersion: v1
kind: Secret
metadata:
  name: shopcloud-secrets
  namespace: shopcloud
type: Opaque
stringData:
  # Single shared Postgres database — see services/*/db.py for tables.
  # In prod the password comes from Secrets Manager; this string is the
  # full connection URL for SQLAlchemy.
  DATABASE_URL: "postgresql+psycopg://shopcloud:CHANGE_ME@shopcloud-rds:5432/shopcloud"

  # Redis (ElastiCache in prod). Cluster cache for cart + wishlist.
  REDIS_URL: "redis://shopcloud-redis:6379/0"

  # Symmetric secret for HS256 JWT signing in local mode. In prod set
  # JWT_VERIFIER=cognito and remove this — verification uses Cognito's
  # JWKS instead of a shared secret.
  JWT_SECRET: "CHANGE_ME_at_least_32_bytes_long_random_value"

  # Cognito-mode config (used when JWT_VERIFIER=cognito).
  # Pulled into env via secretRef in deployment specs.
  COGNITO_REGION: "us-east-1"
  COGNITO_CUSTOMER_POOL_ID: "us-east-1_CHANGEME"
  COGNITO_CUSTOMER_CLIENT_ID: "CHANGEME"
  COGNITO_ADMIN_POOL_ID: "us-east-1_CHANGEME"
  COGNITO_ADMIN_CLIENT_ID: "CHANGEME"

  # Internal-service auth: header value required on every internal call
  # (cart/internal/*, catalog/internal/*, checkout/internal/*).
  INTERNAL_API_KEY: "CHANGE_ME_random_string"

  # SQS / S3 / SES URIs — overlay-specific
  INVOICE_QUEUE_URL: "https://sqs.us-east-1.amazonaws.com/000000000000/shopcloud-invoice"
  INVOICE_BUCKET: "shopcloud-dev-invoices"
  MAIL_FROM: "no-reply@shopcloud.example.com"
