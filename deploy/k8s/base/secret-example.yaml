apiVersion: v1
kind: Secret
metadata:
  name: shopcloud-secrets
  namespace: shopcloud
type: Opaque
stringData:
  DATABASE_URL: "postgresql://CHANGE_ME"
  REDIS_URL: "redis://CHANGE_ME"
  CUSTOMER_DEMO_TOKEN: "customer-demo-token"
  ADMIN_DEMO_TOKEN: "admin-demo-token"
  INVOICE_STORAGE_PATH: "s3://replace-later"
  INVOICE_OUTBOX_PATH: "/tmp/outbox"
  EVENTS_PATH: "/tmp/events"