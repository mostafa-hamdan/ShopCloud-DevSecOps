# Horizontal Pod Autoscalers — scale on CPU. EKS metrics-server must
# be installed (it's a managed addon on EKS).
#
# CPU target = 70% of requested CPU (which is 100m). Means each pod
# averaging 70m+ for the window will trigger a scale-out.
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: catalog
  namespace: shopcloud
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: catalog
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
