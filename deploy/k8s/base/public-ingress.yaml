# Public-facing ALB ingress.
#
# Customer storefront sits at the apex (shopcloud.example.com); the
# JSON API is served from api.shopcloud.example.com. The admin panel
# is NOT routed here — see internal-admin-ingress.yaml.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: public-shopcloud
  namespace: shopcloud
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/group.name: public-shopcloud
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    # Provided by the certificate manager once an ACM cert is issued.
    # alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:...
spec:
  rules:
    - host: shopcloud.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: customer-web
                port:
                  number: 80
    - host: api.shopcloud.example.com
      http:
        paths:
          - path: /catalog
            pathType: Prefix
            backend:
              service:
                name: catalog
                port:
                  number: 8001
          - path: /cart
            pathType: Prefix
            backend:
              service:
                name: cart
                port:
                  number: 8002
          - path: /wishlist
            pathType: Prefix
            backend:
              service:
                name: cart
                port:
                  number: 8002
          - path: /checkout
            pathType: Prefix
            backend:
              service:
                name: checkout
                port:
                  number: 8003
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: auth
                port:
                  number: 8004
