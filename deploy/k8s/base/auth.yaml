# Auth: customer + admin pools, profiles, addresses, session issuance.
# Owns customers, admins, addresses tables.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: shopcloud
  labels:
    app: auth
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
        - name: auth
          image: REPLACE_ME/shopcloud/auth:dev
          ports:
            - containerPort: 8004
          envFrom:
            - configMapRef:
                name: shopcloud-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: shopcloud-secrets
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: shopcloud-secrets
                  key: JWT_SECRET
            - name: INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: shopcloud-secrets
                  key: INTERNAL_API_KEY
            # Bootstrap admin: created on first boot if no admins exist.
            # In prod, set these via Cognito directly and remove these envs.
            - name: BOOTSTRAP_ADMIN_EMAIL
              value: "admin@shopcloud.local"
            - name: BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shopcloud-secrets
                  key: BOOTSTRAP_ADMIN_PASSWORD
                  optional: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 400m
              memory: 256Mi
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: auth
---
apiVersion: v1
kind: Service
metadata:
  name: auth
  namespace: shopcloud
spec:
  selector:
    app: auth
  ports:
    - port: 8004
      targetPort: 8004
