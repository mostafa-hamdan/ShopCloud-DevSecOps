apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: shopcloud

resources:
  - namespace.yaml
  - configmap.yaml
  # secret-example.yaml is committed as a template only.
  # In real deploys the secret is created out-of-band (External Secrets
  # Operator pulling from AWS Secrets Manager) so we don't list it here.
  - catalog.yaml
  - cart.yaml
  - checkout.yaml
  - auth.yaml
  - admin.yaml
  - frontend.yaml
  - hpa.yaml
  - public-ingress.yaml
  - internal-admin-ingress.yaml

# Common labels applied to every resource for ownership tracking.
commonLabels:
  app.kubernetes.io/part-of: shopcloud
