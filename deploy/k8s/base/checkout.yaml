# Checkout: orders, returns. Talks to cart, catalog, auth via cluster
# DNS. Publishes invoice events to SQS (or local queue in dev).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  namespace: shopcloud
  labels:
    app: checkout
spec:
  replicas: 2
  selector:
    matchLabels:
      app: checkout
  template:
    metadata:
      labels:
        app: checkout
    spec:
      # IRSA — pod assumes a role with sqs:SendMessage on the invoice queue.
      # Wired via infra/terraform/modules/irsa/.
      serviceAccountName: shopcloud-checkout
      containers:
        - name: checkout
          image: REPLACE_ME/shopcloud/checkout:dev
          ports:
            - containerPort: 8003
          envFrom:
            - configMapRef:
                name: shopcloud-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: shopcloud-secrets
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: shopcloud-secrets
                  key: JWT_SECRET
            - name: INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: shopcloud-secrets
                  key: INTERNAL_API_KEY
            - name: INVOICE_QUEUE_URL
              valueFrom:
                secretKeyRef:
                  name: shopcloud-secrets
                  key: INVOICE_QUEUE_URL
          readinessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 400m
              memory: 256Mi
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: checkout
---
apiVersion: v1
kind: Service
metadata:
  name: checkout
  namespace: shopcloud
spec:
  selector:
    app: checkout
  ports:
    - port: 8003
      targetPort: 8003
