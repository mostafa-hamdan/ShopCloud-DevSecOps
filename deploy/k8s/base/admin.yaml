# Admin: stateless orchestration over auth, catalog, checkout. Sits
# behind the internal ALB; never reachable from the public internet.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin
  namespace: shopcloud
  labels:
    app: admin
spec:
  replicas: 2
  selector:
    matchLabels:
      app: admin
  template:
    metadata:
      labels:
        app: admin
    spec:
      containers:
        - name: admin
          image: REPLACE_ME/shopcloud/admin:dev
          ports:
            - containerPort: 8005
          envFrom:
            - configMapRef:
                name: shopcloud-config
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: shopcloud-secrets
                  key: JWT_SECRET
            - name: INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: shopcloud-secrets
                  key: INTERNAL_API_KEY
          readinessProbe:
            httpGet:
              path: /health
              port: 8005
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8005
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 400m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: admin
  namespace: shopcloud
spec:
  selector:
    app: admin
  ports:
    - port: 8005
      targetPort: 8005
