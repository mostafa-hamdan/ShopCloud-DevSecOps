apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin
  namespace: shopcloud
spec:
  replicas: 2
  selector:
    matchLabels:
      app: admin
  template:
    metadata:
      labels:
        app: admin
    spec:
      containers:
        - name: admin
          image: REPLACE_ME/shopcloud/admin:dev
          ports:
            - containerPort: 8005
          env:
            - name: CORS_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: shopcloud-config
                  key: CORS_ORIGINS
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: shopcloud-secrets
                  key: DATABASE_URL
            - name: ADMIN_DEMO_TOKEN
              valueFrom:
                secretKeyRef:
                  name: shopcloud-secrets
                  key: ADMIN_DEMO_TOKEN
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8005
            initialDelaySeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8005
            initialDelaySeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 400m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: admin
  namespace: shopcloud
spec:
  selector:
    app: admin
  ports:
    - port: 8005
      targetPort: 8005