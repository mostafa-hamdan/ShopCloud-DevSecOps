apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: internal-admin
  namespace: shopcloud
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internal
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
    alb.ingress.kubernetes.io/group.name: internal-shopcloud
spec:
  rules:
    - host: admin.shopcloud.internal
      http:
        paths:
          - path: /admin
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
    - host: admin-api.shopcloud.internal
      http:
        paths:
          - path: /admin
            pathType: Prefix
            backend:
              service:
                name: admin
                port:
                  number: 8005
          - path: /demo/login/admin
            pathType: Prefix
            backend:
              service:
                name: auth
                port:
                  number: 8004