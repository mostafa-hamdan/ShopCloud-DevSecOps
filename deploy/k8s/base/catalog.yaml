# Catalog: products, categories, reviews. Reads-heavy, public-facing.
# Owns its own tables in the shared shopcloud Postgres database.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: shopcloud
  labels:
    app: catalog
spec:
  replicas: 2
  selector:
    matchLabels:
      app: catalog
  template:
    metadata:
      labels:
        app: catalog
    spec:
      containers:
        - name: catalog
          image: REPLACE_ME/shopcloud/catalog:dev
          ports:
            - containerPort: 8001
          envFrom:
            - configMapRef:
                name: shopcloud-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: shopcloud-secrets
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: shopcloud-secrets
                  key: JWT_SECRET
            - name: INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: shopcloud-secrets
                  key: INTERNAL_API_KEY
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 400m
              memory: 256Mi
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: catalog
---
apiVersion: v1
kind: Service
metadata:
  name: catalog
  namespace: shopcloud
spec:
  selector:
    app: catalog
  ports:
    - port: 8001
      targetPort: 8001
