apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: shopcloud
spec:
  replicas: 2
  selector:
    matchLabels:
      app: catalog
  template:
    metadata:
      labels:
        app: catalog
    spec:
      containers:
        - name: catalog
          image: REPLACE_ME/shopcloud/catalog:dev
          ports:
            - containerPort: 8001
          env:
            - name: CORS_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: shopcloud-config
                  key: CORS_ORIGINS
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: shopcloud-secrets
                  key: DATABASE_URL
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8001
            initialDelaySeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8001
            initialDelaySeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 400m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: catalog
  namespace: shopcloud
spec:
  selector:
    app: catalog
  ports:
    - port: 8001
      targetPort: 8001