apiVersion: v1
kind: ConfigMap
metadata:
  name: shopcloud-config
  namespace: shopcloud
data:
  APP_ENV: dev
  CORS_ORIGINS: "*"
  ADMIN_CORS_ORIGINS: "*"
  QUEUE_BACKEND: sqs
  STORAGE_BACKEND: local
  MAIL_BACKEND: local
  AWS_REGION: us-east-1
  AWS_DEFAULT_REGION: us-east-1
  NEXT_PUBLIC_CATALOG_URL: ""
  NEXT_PUBLIC_CART_URL: ""
  NEXT_PUBLIC_CHECKOUT_URL: ""
  NEXT_PUBLIC_AUTH_URL: ""
  NEXT_PUBLIC_ADMIN_URL: ""
